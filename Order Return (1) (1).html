<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Return</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --surface:#f1f3f9; --surface-2:#e9ecf5; --line:#e3e6ef; --line-strong:#cdd2df;
  --ink:#141a2e; --ink-2:#4b5470; --ink-3:#7c849c;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#e8efff; --navy:#0f1b4d;
  --ok:#14804f; --ok-soft:#e2f5ea; --warn:#a36508; --warn-soft:#fdf1dc;
  --bad:#c03a2b; --bad-soft:#fde8e5; --info:#1a6fa8; --info-soft:#e1f0fa;
  --ro:#f3f4f8; --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px rgba(20,26,46,.05);
  --radius:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --panel:#161b2b; --surface:#1c2234; --surface-2:#242b40; --line:#2a3148; --line-strong:#3a4360;
  --ink:#e8ebf4; --ink-2:#b5bccf; --ink-3:#858da5; --accent:#8492ff; --accent-ink:#0e1230; --accent-soft:#232a52; --navy:#1a2050;
  --ok:#4cc38a; --ok-soft:#14321f; --warn:#e3a647; --warn-soft:#382a12; --bad:#ef7a6a; --bad-soft:#3b1c18; --info:#62b2e8; --info-soft:#13304a;
  --ro:#1a2031; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --panel:#161b2b; --surface:#1c2234; --surface-2:#242b40; --line:#2a3148; --line-strong:#3a4360;
  --ink:#e8ebf4; --ink-2:#b5bccf; --ink-3:#858da5; --accent:#8492ff; --accent-ink:#0e1230; --accent-soft:#232a52; --navy:#1a2050;
  --ok:#4cc38a; --ok-soft:#14321f; --warn:#e3a647; --warn-soft:#382a12; --bad:#ef7a6a; --bad-soft:#3b1c18; --info:#62b2e8; --info-soft:#13304a;
  --ro:#1a2031; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;letter-spacing:-.02em}
.brand b{font-size:15.5px;display:block;line-height:1.2;font-weight:700}
.brand small{color:var(--ink-3);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;margin-bottom:2px;font-size:13.5px}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:17px;height:17px;flex:none}
.nav-sep{font-size:12px;color:var(--ink-3);padding:16px 10px 6px;font-weight:600}
.nav-sep:first-child{padding-top:0}
.nav .sn{width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:11px;display:grid;place-items:center;flex:none;font-weight:700}
.nav a.on .sn{background:var(--accent);color:var(--accent-ink)}
.nav .cnt{margin-left:auto;font-size:11.5px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me b{display:block;font-size:13.5px;line-height:1.2}
.me small{color:var(--ink-3);font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 26px}
.menu-btn{display:none}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who-name{font-weight:600}
.store-badge{font-size:12px;color:var(--ink-3);white-space:nowrap}
.content{padding:26px;overflow-y:auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:23px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:15.5px;margin:0 0 12px;font-weight:700}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
.sub{color:var(--ink-3);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:13.5px}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:600}
.field label .req{color:var(--bad)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel)}
.field textarea{min-height:64px;resize:vertical}
.field.wide{grid-column:1/-1}
.field input[readonly]{background:var(--ro);border-color:var(--line);border-style:dashed;color:var(--ink-2)}
.ro{display:block;padding:9px 11px;border:1px dashed var(--line-strong);border-radius:9px;min-height:39px;background:var(--ro);color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-3);margin-top:3px}
.err{color:var(--bad);font-size:12.5px;margin-top:3px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line-strong);vertical-align:-2px;margin-right:5px;background:var(--panel)}
.legend span.r::before{background:var(--ro);border-style:dashed}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:var(--surface);font-weight:600;color:var(--ink-2);font-size:12.5px}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface)}
td.num,th.num{text-align:right}
td input.q{width:90px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:7px;text-align:right;background:var(--panel)}
td select.s{padding:6px 7px;border:1px solid var(--line-strong);border-radius:7px;background:var(--panel)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--info-soft);color:var(--info)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:20px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--panel);text-decoration:none;color:inherit;display:block;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tone,var(--line-strong))}
a.card:hover{border-color:var(--tone,var(--accent))}
.card .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:6px;letter-spacing:-.02em}
.card .v.money{font-size:19px}
.card .l{font-size:12.5px;color:var(--ink-3);font-weight:500}
.tone-acc{--tone:var(--accent)} .tone-ok{--tone:var(--ok)} .tone-warn{--tone:var(--warn)} .tone-bad{--tone:var(--bad)} .tone-info{--tone:var(--info)}
.card.hl .v{color:var(--warn)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.chart-box{position:relative;height:240px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.filters input,.filters select{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);font-size:13px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 0 0;color:var(--ink-3);font-size:13px}
.empty{text-align:center;padding:44px 16px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* stage track */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 18px}
.st{position:relative;padding:12px 12px 11px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--panel);text-align:left;color:var(--ink-3)}
.st .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.st .t{display:block;font-weight:600;color:var(--ink);font-size:13px;line-height:1.3}
.st .s{display:block;font-size:12px;margin-top:2px}
.st.done{border-color:var(--ok-soft);background:linear-gradient(var(--ok-soft),var(--ok-soft)) top/100% 3px no-repeat,var(--panel)} .st.done .n{background:var(--ok);color:#fff}
.st.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)} .st.cur .n{background:var(--accent);color:var(--accent-ink)}
.st.stop{border-color:var(--bad)} .st.stop .n{background:var(--bad);color:#fff}
.st.sel .t{color:var(--accent)}
.next{display:flex;gap:12px;align-items:center;padding:13px 18px;border-radius:var(--radius);background:var(--accent-soft);color:var(--ink);margin-bottom:16px;flex-wrap:wrap}
.next b{color:var(--accent)}
.next.stop{background:var(--bad-soft)} .next.stop b{color:var(--bad)}
.next.hold{background:var(--warn-soft)} .next.hold b{color:var(--warn)}
.next.done{background:var(--ok-soft)} .next.done b{color:var(--ok)}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px;font-size:13px}
.meta div span{display:block;color:var(--ink-3);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.att-i{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;background:var(--surface);cursor:pointer}
.att-i img{width:28px;height:28px;object-fit:cover;border-radius:5px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0 9px 16px;border-left:2px solid var(--line);position:relative;font-size:13px}
.hist li::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hist li b{font-weight:600}
.hist small{color:var(--ink-3);display:block}
.lock{padding:11px 14px;background:var(--surface);border-radius:9px;color:var(--ink-2);font-size:13px;margin-bottom:14px}
.modal-back{position:fixed;inset:0;background:rgba(10,14,30,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-back.show{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal.big{max-width:860px}
.modal p{margin:0 0 14px;color:var(--ink-2)}
.modal .actions{justify-content:flex-end}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{padding:11px 15px;border-radius:9px;background:var(--ink);color:var(--panel);font-size:13px;max-width:360px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-3);padding:40px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:280px}
.cust-card{background:var(--surface);border-radius:10px;padding:13px 15px;margin-top:12px}
.tests li{padding:7px 0;border-bottom:1px solid var(--line);list-style:none}
.tests{padding:0;margin:0}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
/* login */
.login{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.login[hidden]{display:none}
.login-wrap{display:grid;grid-template-columns:minmax(300px,1fr) 1.2fr;min-height:100%}
.login-side{background:var(--side1);color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.login-side .brand{padding:0}
.login-side .brand small{color:rgba(255,255,255,.7)}
.login-side .brand-mark{background:#fff;color:var(--side1)}
.login-h{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0;max-width:16ch}
.login-steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:4px}
.login-steps li{counter-increment:s;display:flex;align-items:center;gap:12px;padding:8px 0;color:rgba(255,255,255,.88);font-weight:500;position:relative}
.login-steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;background:var(--side1);position:relative;z-index:1}
.login-steps li:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:36px;height:calc(100% - 28px);width:1.5px;background:rgba(255,255,255,.25)}
.login-main{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;gap:22px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-card h1{margin-bottom:2px}
.login-card .sub{margin-bottom:20px}
.login-card .field{margin-bottom:14px}
.demo{width:100%;max-width:420px}
.demo h3{margin:0}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.demo-u{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.demo-u:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-u b{display:block;font-size:13px}
.demo-u span{font-size:12px;color:var(--ink-3)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:264px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .menu-btn{display:inline-flex}
  .top{padding:10px 14px}
  .who .who-name,.who .store-badge{display:none}
  .content{padding:16px}
  .track{grid-template-columns:repeat(3,1fr)}
  .login-wrap{grid-template-columns:1fr}
  .login-side{padding:28px 24px;gap:16px}
  .login-h{font-size:22px}
  .login-steps{display:none}
}
@media (max-width:520px){.track{grid-template-columns:repeat(2,1fr)}.demo-grid{grid-template-columns:1fr}}
/* sidebar & top bar theme */
.side{background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 100%);border-right:0;color:#fff}
.side .brand b{color:#fff}.side .brand small{color:#9fb0e0}
.side .brand-mark{background:var(--accent-solid);color:#fff}
.nav a{color:#d3dbf3}.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.11);color:#fff}
.nav-sep{color:#8695c3;text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:700}
.nav .sn{background:rgba(255,255,255,.13);color:#fff}.nav a.on .sn{background:var(--accent-solid);color:#fff}
.nav .cnt{background:var(--accent-solid);color:#fff}
.side-foot{border-top:1px solid rgba(255,255,255,.12)}
.side .me b{color:#fff}.side .me small{color:#9fb0e0}
.side .avatar{background:var(--accent-solid)}
.side-foot .btn{background:transparent;color:#d3dbf3;border-color:rgba(255,255,255,.25)}
.side-foot .btn:hover{background:rgba(255,255,255,.08);color:#fff}
.top{padding:14px 28px;gap:18px}
.crumbs{display:flex;flex-direction:column;min-width:0}
.crumbs small{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap}
.search{margin-left:10px}
.search input{padding:11px 14px 11px 40px;border-radius:12px}
#storeBadge{order:-1;background:#fff3d1;color:#9a6700;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12px}
.who-role{font-size:12.5px;color:var(--ink-2);font-weight:600}
.avatar.top-av{background:#d63d6a;width:38px;height:38px}
.menu-btn{width:40px;height:40px;justify-content:center;padding:0;border-radius:10px;font-size:16px}
.panel{border-radius:16px}
.app.collapsed{grid-template-columns:0 1fr}.app.collapsed .side{visibility:hidden;overflow:hidden;padding:0}
.cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.card::after{display:none}
.card .l::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--line-strong));margin-right:7px;vertical-align:1px}
/* detail hero */
.hero-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.avatar.xl{width:76px;height:76px;font-size:25px;background:#3b4a7a}
.hero-id{flex:1;min-width:220px}.hero-id h1{font-size:25px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--panel)}
.hero-act{margin:0}

.st-h{display:flex;align-items:center;gap:10px}
.st-h .pipe-n{margin:0;width:34px;height:34px;font-size:15px;border-radius:10px}

.tt-note b{color:var(--s4)}.tt-note span{font-size:13px;color:var(--ink-2)}

.leg-n{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.leg-h b{display:block}.leg-h small{color:var(--ink-3);font-size:12.5px}
.subcat b{display:block;font-size:13px}.subcat small{color:var(--ink-3);font-size:12px}
@media (max-width:1100px){.pipe{grid-template-columns:repeat(3,1fr)}.pipe-s::after{display:none}}

/* ===== Demo data, built through the real workflow rules ===== */

    {d:"2026-08-20",c:"C1003",reason:"Wrong Material",lines:[["INV/26-27/0490","P105",200]],approve:{decision:"Rejected",reason:"Material supplied as per PO, no deviation found"}},

    {d:"2026-09-10",c:"C1001",reason:"Customer Requirement",lines:[["INV/26-27/0412","P103",40]],upto:"s4",hold:"Customer asked to reschedule pickup after Diwali"},
    {d:"2026-09-22",c:"C1005",reason:"Damaged",lines:[["INV/26-27/0644","P101",2]],upto:"s5r"},
    {d:"2026-10-03",c:"C1002",reason:"Quality Issue",lines:[["INV/26-27/0611","P102",5]],upto:"s5",tt:"FOR",tr:{mode:"Customer Arranged",name:"Customer’s own",vehicle:"CG07 ZX 4410",driver:"",mobile:"",lr:"",cost:""}},
    {d:"2026-10-07",c:"C1001",reason:"Excess Material",lines:[["INV/26-27/0538","P106",30]],upto:"s4"},
    {d:"2026-10-10",c:"C1003",reason:"Defective",lines:[["INV/26-27/0490","P104",4]],approve:{decision:"Partially Approved",ratio:.75,reason:"1 MT is usable at site"},upto:"s3"},
    {d:"2026-10-14",c:"C1004",reason:"Damaged",lines:[["INV/26-27/0587","P106",15]],upto:"s2"},

    {d:"2026-10-18",c:"C1002",reason:"Damaged",lines:[["INV/26-27/0455","P102",6]],upto:"draft"}
  ];
  const fin=r=>{
    const cn_=cust(r.customerId).name;
    if(r.debit?.number)r.attachments.debit=[docCopy("Debit Note",r.debit.number,[["Customer",cn_],["Date",fdate(r.debit.date)],["Amount",money(r.debit.amount)],["Tax",money(r.debit.tax)],["Against return",r.no]])];
    if(r.transport?.vehicle)r.attachments.veh1=[docCopy("Vehicle",r.transport.vehicle,[["Transporter",r.transport.name],["Driver",r.transport.driver||"—"],["Mobile",r.transport.mobile||"—"],["Date",fdate(r.transport.pickup)]])];

    r=ok(applyCloseReceipt(r,"",U("store")),r.no).r;if(p.upto==="s6")return fin(r);
    const b=creditBasis(r);
    r=ok(applyCredit(r,{required:"Yes",status:"Issued",number:"CN/26-27/"+(++cn),date:add(p.d,10),amount:String(b.base),tax:String(b.tax),adjReason:"",notReqReason:"",remarks:""},U("accounts")),r.no).r;
    fin(r);
  });
  S.returns=R;S.movements=M;persistLocal();
}

async function hashPw(pw,salt){
  const data=salt+"::"+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(data));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

}

/* ============================ domain logic (pure) ============================ */
function committedQty(returns,invoiceNo,productId,excludeId){
  return returns.filter(r=>r.id!==excludeId&&!["Rejected","Cancelled","Draft"].includes(r.status))
    .reduce((s,r)=>s+r.items.filter(i=>i.invoiceNo===invoiceNo&&i.productId===productId)
      .reduce((a,i)=>a+(i.apprQty!=null?i.apprQty:i.reqQty),0),0);
}
function nextSeq(prefix,list){
  let max=0;list.forEach(v=>{if(v&&v.startsWith(prefix)){const n=parseInt(v.slice(prefix.length),10);if(n>max)max=n}});
  return prefix+String(max+1).padStart(4,"0");
}
const newReturnNo=(returns,date)=>nextSeq("RR-"+yymm(date)+"-",returns.map(r=>r.no));
const newGRN=(returns,date)=>nextSeq("GRN-"+yymm(date)+"-",returns.flatMap(r=>(r.receipts||[]).map(x=>x.grn)));
function addHist(r,action,detail,ctx){(r.history=r.history||[]).push({at:nowISO(),by:ctx.by,role:ctx.role,action,detail:detail||""})}
function diffFields(oldO,newO,labels){
  const out=[];for(const k in labels){const a=oldO?.[k]??"",b=newO?.[k]??"";if(String(a)!==String(b))out.push(`${labels[k]}: “${a||"blank"}” → “${b||"blank"}”`)}
  return out.join("; ");
}
function itemTotals(r,item){
  let recv=0,acc=0,rej=0,scr=0;
  (r.receipts||[]).forEach(rc=>rc.lines.forEach(l=>{if(l.key===item.key){recv+=l.recv;acc+=l.accept;rej+=l.reject;scr+=l.scrap}}));
  return {recv:round(recv),acc:round(acc),rej:round(rej),scr:round(scr)};
}
function sumItems(r,f){return round(r.items.reduce((s,i)=>s+(f(i)||0),0))}

function newReturn(){
  return {id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:"",date:today(),customerId:"",transportType:"Company Pickup",reason:"",remarks:"",items:[],
    attachments:{request:[],approval:[],debit:[],transport:[],qc:[],credit:[]},stage:1,status:"Draft",
    approval:{status:"Pending",history:[]},debit:{required:"Yes",status:"Pending"},transport:{status:"Not Arranged",biltyReq:"No"},receipts:[],receiptClosed:false,
    credit:{required:"Yes",status:"Pending"},history:[],company:MASTERS.company};
}

/* Stage 1 */
function validateRequest(r,returns){
  const e=[];
  if(!r.customerId)e.push("Select a customer.");
  if(!r.date)e.push("Enter the request date.");
  if(!r.items.length)e.push("Select at least one invoice line to return.");
  const seen=new Set();
  r.items.forEach(i=>{
    if(seen.has(i.key))e.push(`${prod(i.productId).name} on ${i.invoiceNo} is selected twice.`);seen.add(i.key);
    if(!i.reason)e.push(`Choose a return reason for ${prod(i.productId).name}.`);
    if(i.reason==="Other"&&!i.note?.trim())e.push(`Add a note explaining “Other” for ${prod(i.productId).name}.`);
    const it=invItem(i.invoiceNo,i.productId);
    const bal=round((it.qty||0)-committedQty(returns,i.invoiceNo,i.productId,r.id));
    if(!(i.reqQty>0))e.push(`Enter a return quantity above zero for ${prod(i.productId).name}.`);
    else if(i.reqQty>bal)e.push(`${prod(i.productId).name} on ${i.invoiceNo}: return quantity ${qf.format(i.reqQty)} is more than the returnable balance of ${qf.format(bal)}.`);
  });
  return e;
}
function applySubmit(r,returns,ctx){
  const e=validateRequest(r,returns);if(e.length)return {ok:false,errors:e};
  r=clone(r);if(!r.no)r.no=newReturnNo(returns,r.date);
  r.createdBy=r.createdBy||ctx.by;r.stage=2;r.status="Pending Approval";r.approval.status="Pending";
  addHist(r,"Submitted for approval",`${r.items.length} line(s), ${sumItems(r,i=>i.reqQty)} units requested`,ctx);
  return {ok:true,r};
}
/* Stage 2 */
function applyApproval(r,{decision,qtys,reason,remarks},ctx){
  const e=[];r=clone(r);
  if(r.stage!==2)e.push("This return is not waiting for approval.");
  if(!["Approved","Partially Approved","Rejected"].includes(decision))e.push("Choose a decision.");
  if(decision!=="Approved"&&!reason?.trim())e.push("Add remarks. They’re required when a return is rejected or only partly approved.");
  const lines=r.items.map(i=>{
    let a=decision==="Approved"?i.reqQty:decision==="Rejected"?0:num(qtys?.[i.key]);
    if(a<0)e.push(`${prod(i.productId).name}: approved quantity can’t be negative.`);
    if(a>i.reqQty)e.push(`${prod(i.productId).name}: approved quantity ${qf.format(a)} is more than the requested ${qf.format(i.reqQty)}.`);
    return a;
  });
  if(decision==="Partially Approved"){
    const tot=lines.reduce((s,a)=>s+a,0),req=sumItems(r,i=>i.reqQty);
    if(tot<=0)e.push("A partial approval needs at least one line with an approved quantity. Use Reject instead.");
    else if(tot>=req)e.push("All quantities are fully approved. Choose Approved instead.");
  }
  if(e.length)return {ok:false,errors:e};
  if(r.approval.status&&r.approval.status!=="Pending")r.approval.history.push({...r.approval,history:undefined});
  r.items.forEach((i,k)=>{i.apprQty=round(lines[k]);i.rejQty=round(i.reqQty-lines[k])});
  r.approval={...r.approval,status:decision,by:ctx.by,date:today(),at:nowISO(),reason:reason||"",remarks:remarks||""};
  if(decision==="Rejected"){r.status="Rejected"}else{r.status=decision;r.stage=3}
  addHist(r,decision,`Approved ${sumItems(r,i=>i.apprQty)} of ${sumItems(r,i=>i.reqQty)}${reason?" · "+reason:""}`,ctx);
  return {ok:true,r};
}
/* Stage 3 */
function applyDebit(r,d,ctx){
  const e=[];r=clone(r);
  if(r.stage<3)e.push("Approve the return before recording the debit note.");
  if(d.required==="No"){
    if(!d.notReqReason?.trim())e.push("Enter why a debit note isn’t required.");
    d.status="Not Required";
  }else{
    if(d.status==="Not Required")e.push("Set “Debit note required?” to No to mark it Not Required.");
    if(d.status==="Received"){
      if(!d.number?.trim())e.push("Enter the debit note number.");
      if(!d.date)e.push("Enter the debit note date.");
      if(!(num(d.amount)>0))e.push("Enter a debit note amount above zero.");
    }
  }
  if(e.length)return {ok:false,errors:e};
  const labels={required:"Required",status:"Status",number:"Number",date:"Date",amount:"Amount",tax:"Tax",notReqReason:"Reason",remarks:"Remarks"};
  const changes=diffFields(r.debit,d,labels);
  r.debit={...r.debit,...d,amount:d.amount===""?"":num(d.amount),tax:d.tax===""?"":num(d.tax),submittedBy:ctx.by,updatedAt:nowISO()};
  let moved=false;
  if(r.stage===3&&["Received","Not Required"].includes(r.debit.status)){r.stage=4;r.status="In Progress";moved=true}
  addHist(r,moved?"Debit note completed":"Debit note updated",changes||"No field changes",ctx);
  return {ok:true,r,moved};
}
/* Stage 4 */
function applyTransport(r,t,ctx){
  const e=[];r=clone(r);
  if(r.stage<4)e.push("Finish the debit note stage before arranging the vehicle.");
  if(!t.mode)e.push("Choose a transport mode.");
  const active=["Arranged","In Transit","Delivered"].includes(t.status);
  if(active){
    const badMob=m=>m&&!/^[+\d][\d\s-]{7,15}$/.test(m.trim()),two=t.mode==="Two-leg";
    if(t.mode==="Customer Arranged"||two){
      if(!t.vehicle?.trim())e.push(two?"Leg 1: enter the customer’s vehicle number.":"Enter the vehicle number the customer is sending.");
    }else{
      if(!t.name?.trim())e.push("Enter the transport name.");
      if(!t.vehicle?.trim())e.push("Enter the vehicle number.");
      if(!t.driver?.trim())e.push("Enter the driver name.");
    }
    if(badMob(t.mobile))e.push("Enter a valid driver mobile number.");
    if(!t.pickup)e.push(two?"Leg 1: enter the drop date at the transport office.":"Enter the pickup / dispatch date.");
    if(two){const l=t.leg2||{};
      if(!t.office?.trim())e.push("Leg 1: enter the transport office name.");
      if(!l.name?.trim())e.push("Leg 2: enter the transport name.");
      if(!l.vehicle?.trim())e.push("Leg 2: enter our vehicle number.");
      if(!l.driver?.trim())e.push("Leg 2: enter the driver name.");
      if(badMob(l.mobile))e.push("Leg 2: enter a valid driver mobile number.");
      if(!l.date)e.push("Leg 2: enter the pickup date from the office.");
      else if(t.pickup&&l.date<t.pickup)e.push("Leg 2 pickup can’t be before the leg 1 drop date.");
    }
  }
  if(t.biltyReq==="Yes"&&!t.biltyNo?.trim())e.push("Enter the bilty number. It’s required when bilty is set to Yes.");
  if(t.expected&&t.pickup&&t.expected<t.pickup)e.push("Expected delivery date can’t be before the pickup date.");
  if(t.cost!==""&&num(t.cost)<0)e.push("Transport cost can’t be negative.");
  if(e.length)return {ok:false,errors:e};
  const labels={mode:"Mode",name:"Transporter",vehicle:"Vehicle",driver:"Driver",mobile:"Mobile",pickup:"Pickup",expected:"Expected",cost:"Cost",biltyReq:"Bilty required",biltyNo:"Bilty no.",lr:"LR / tracking",status:"Status",remarks:"Remarks"};
  const changes=diffFields(r.transport,t,labels);
  r.transport={...r.transport,...t,cost:t.cost===""?"":num(t.cost),updatedBy:ctx.by,updatedAt:nowISO()};
  let moved=false;
  if(r.stage===4&&["In Transit","Delivered"].includes(t.status)){r.stage=5;moved=true}
  addHist(r,moved?"Vehicle dispatched":"Transport updated",changes||"No field changes",ctx);
  return {ok:true,r,moved};
}
/* Stage 5 */
function applyReceipt(r,rc,returns,ctx){
  const e=[];r=clone(r);
  if(r.stage!==5)e.push("Material can be received only once the vehicle is in transit or delivered.");
  if(!rc.date)e.push("Enter the actual received date.");
  if(!["Pending","Passed","Partially Passed","Failed"].includes(rc.qcStatus))e.push("Choose a QC status.");
  let rTot=0,aTot=0,bad=0;
  rc.lines.forEach(l=>{
    const it=r.items.find(i=>i.key===l.key);const p=prod(it.productId);
    ["recv","accept","reject","scrap"].forEach(k=>l[k]=round(num(l[k])));
    if([l.recv,l.accept,l.reject,l.scrap].some(v=>v<0))e.push(`${p.name}: quantities can’t be negative.`);
    const already=itemTotals(r,it).recv;
    if(l.recv+already>it.apprQty&&!rc.exceptionReason?.trim())e.push(`${p.name}: received ${qf.format(l.recv+already)} in total is more than the approved ${qf.format(it.apprQty)}.`);
    if(round(l.accept+l.reject+l.scrap)!==l.recv)e.push(`${p.name}: accepted + rejected + scrap (${qf.format(round(l.accept+l.reject+l.scrap))}) must equal received (${qf.format(l.recv)}).`);
    if(l.recv>0&&!l.condition)e.push(`${p.name}: choose the material condition.`);
    if(l.accept>0&&!l.stockType)e.push(`${p.name}: choose the stock type for accepted quantity.`);
    if(l.accept>0&&!l.warehouse)e.push(`${p.name}: choose the warehouse for accepted quantity.`);
    if(l.accept>0&&l.stockType==="Scrap")e.push(`${p.name}: put scrap in the Scrap column, not as accepted stock.`);
    rTot+=l.recv;aTot+=l.accept;bad+=l.reject+l.scrap;
  });
  if(rTot<=0)e.push("Enter a received quantity on at least one line.");
  if(rc.qcStatus==="Passed"&&bad>0)e.push("QC can’t be Passed when some quantity is rejected or scrapped. Use Partially Passed.");
  if(rc.qcStatus==="Failed"&&aTot>0)e.push("QC can’t be Failed when some quantity is accepted. Use Partially Passed.");
  if(rc.qcStatus==="Partially Passed"&&(aTot<=0||bad<=0))e.push("Partially Passed needs both accepted and rejected/scrap quantities.");
  if(e.length)return {ok:false,errors:e};
  const grn=newGRN(returns.concat([r]),rc.date);
  r.receipts.push({...rc,lines:rc.lines.filter(l=>l.recv>0),grn,by:ctx.by,at:nowISO(),posted:false,invStatus:"Pending",attachments:rc.attachments||[]});
  if(!r.transport.actual){r.transport.actual=rc.date}
  if(r.transport.status!=="Delivered"){r.transport.status="Delivered"}
  addHist(r,"Material received",`${grn}: received ${round(rTot)}, accepted ${round(aTot)}, QC ${rc.qcStatus}${rc.exceptionReason?" · Exception: "+rc.exceptionReason:""}`,ctx);
  return {ok:true,r,grn};
}
function applyQcUpdate(r,grn,qcStatus,ctx){
  r=clone(r);const rc=r.receipts.find(x=>x.grn===grn);
  if(!rc)return {ok:false,errors:["Receipt not found."]};
  if(rc.posted)return {ok:false,errors:["Stock is already posted for this receipt. QC can’t change."]};
  const a=rc.lines.reduce((s,l)=>s+l.accept,0),b=rc.lines.reduce((s,l)=>s+l.reject+l.scrap,0);
  if(qcStatus==="Passed"&&b>0||qcStatus==="Failed"&&a>0||qcStatus==="Partially Passed"&&(a<=0||b<=0))return {ok:false,errors:["That QC status doesn’t match the accepted and rejected quantities on this receipt."]};
  const old=rc.qcStatus;rc.qcStatus=qcStatus;addHist(r,"QC status changed",`${grn}: ${old} → ${qcStatus}`,ctx);
  return {ok:true,r};
}
function applyPosting(r,grn,movements,ctx){
  r=clone(r);const rc=r.receipts.find(x=>x.grn===grn);
  if(!rc)return {ok:false,errors:["Receipt not found."]};
  if(rc.posted||movements.some(m=>m.grn===grn))return {ok:false,errors:[`Stock for ${grn} is already posted. Duplicate posting is blocked.`]};
  if(rc.qcStatus==="Pending")return {ok:false,errors:["Finish QC before posting stock. QC status is still Pending."]};
  const moves=[];
  rc.lines.forEach((l,ix)=>{
    const it=r.items.find(i=>i.key===l.key);const p=prod(it.productId);
    const base={grn,returnNo:r.no,returnId:r.id,productId:it.productId,product:p.name,uom:p.uom,date:rc.date,by:ctx.by,at:nowISO(),invoiceNo:it.invoiceNo};
    if(l.accept>0)moves.push({...base,id:`${grn}-${ix}-A`,qty:l.accept,stockType:l.stockType,warehouse:l.warehouse,movement:"Return receipt"});
    if(l.scrap>0)moves.push({...base,id:`${grn}-${ix}-S`,qty:l.scrap,stockType:"Scrap",warehouse:"Scrap Yard",movement:"Return to scrap"});
  });
  rc.posted=true;rc.postedBy=ctx.by;rc.postedAt=nowISO();
  if(moves.length){rc.invStatus="Posted";rc.postRef="SA-"+grn.slice(4);moves.forEach(m=>m.ref=rc.postRef)}else{rc.invStatus="Not Applicable"}
  addHist(r,"Stock posted",moves.length?`${rc.postRef}: ${moves.map(m=>`${qf.format(m.qty)} ${m.uom} ${m.product} → ${m.stockType}, ${m.warehouse}`).join("; ")}`:`${grn}: nothing to post (all rejected)`,ctx);
  return {ok:true,r,moves};
}
function applyCloseReceipt(r,shortReason,ctx){
  r=clone(r);const e=[];
  if(r.stage!==5)e.push("This return isn’t at the receipt stage.");
  if(!r.receipts.length)e.push("Record at least one material receipt first.");
  if(r.receipts.some(x=>!x.posted))e.push("Post stock (or confirm Not Applicable) for every receipt before closing.");
  const recv=round(r.items.reduce((s,i)=>s+itemTotals(r,i).recv,0)),appr=sumItems(r,i=>i.apprQty);
  if(recv<appr&&!shortReason?.trim())e.push(`Only ${qf.format(recv)} of ${qf.format(appr)} approved units have arrived. Enter a reason to close the receipt short.`);
  if(e.length)return {ok:false,errors:e};
  r.receiptClosed=true;r.stage=6;r.credit.status=r.credit.status||"Pending";
  addHist(r,"Receipt & QC closed",recv<appr?`Short-closed at ${recv}/${appr}: ${shortReason}`:`All ${recv} units received`,ctx);
  return {ok:true,r};
}
function creditBasis(r){
  let base=0,tax=0,cap=0;
  r.items.forEach(i=>{const t=itemTotals(r,i),it=invItem(i.invoiceNo,i.productId),p=prod(i.productId),price=it.price||p.price||0;
    base+=t.acc*price;tax+=t.acc*price*(p.gst||0)/100;cap+=(i.apprQty||0)*price});
  return {base:round(base,2),tax:round(tax,2),cap:round(cap,2)};
}
/* Stage 6 */
function applyCredit(r,c,ctx){
  const e=[];r=clone(r);
  if(r.stage!==6)e.push("Close material receipt & QC before issuing the credit note.");
  const basis=creditBasis(r);
  if(c.required==="No"){
    if(!c.notReqReason?.trim())e.push("Enter why a credit note isn’t required.");
    if(!["Accounts","Management / Admin","Super Admin"].includes(ctx.role))e.push("Only Accounts or Management can mark a credit note Not Required.");
    c.status="Not Required";
  }else{
    if(c.status==="Not Required")e.push("Set “Credit note required?” to No to mark it Not Required.");
    if(c.status==="Issued"){
      if(!c.number?.trim())e.push("Enter the credit note number.");
      if(!c.date)e.push("Enter the credit note date.");
      if(!(num(c.amount)>0))e.push("Enter a credit note amount above zero.");
      if(num(c.amount)>basis.cap+0.01)e.push(`Credit amount ${money(c.amount)} is more than the approved value ${money(basis.cap)}.`);
    }
  }
  if(e.length)return {ok:false,errors:e};
  const labels={required:"Required",status:"Status",number:"Number",date:"Date",amount:"Amount",tax:"Tax",adjReason:"Adjustment reason",notReqReason:"Reason",remarks:"Remarks"};
  const changes=diffFields(r.credit,c,labels);
  r.credit={...r.credit,...c,amount:c.amount===""?"":num(c.amount),tax:c.tax===""?"":num(c.tax),suggested:basis.base,issuedBy:ctx.by,updatedAt:nowISO()};
  let moved=false;
  if(["Issued","Not Required"].includes(r.credit.status)){r.stage=7;r.status="Completed";r.completedAt=nowISO();moved=true}
  addHist(r,moved?(r.credit.status==="Issued"?"Credit note issued":"Closed without credit note"):"Credit note updated",changes||"No field changes",ctx);
  return {ok:true,r,moved};
}
function applyHold(r,reason,ctx){
  r=clone(r);if(!reason?.trim())return {ok:false,errors:["Enter a reason for the hold."]};
  if(["Completed","Cancelled","Rejected"].includes(r.status))return {ok:false,errors:["Closed returns can’t be put on hold."]};
  r.prevStatus=r.status;r.status="On Hold";r.holdReason=reason;addHist(r,"Put on hold",reason,ctx);return {ok:true,r};
}
function applyResume(r,ctx){r=clone(r);r.status=r.prevStatus||"In Progress";r.holdReason="";addHist(r,"Resumed","",ctx);return {ok:true,r}}
function applyCancel(r,reason,movements,ctx){
  r=clone(r);const e=[];
  if(!reason?.trim())e.push("Enter a cancellation reason.");
  if(r.status==="Completed")e.push("Completed returns can’t be cancelled. Use an authorised reversal.");
  if(movements.some(m=>m.returnId===r.id))e.push("Stock is already posted for this return. Reverse the stock movement before cancelling.");
  if(r.credit?.status==="Issued")e.push("A credit note is already issued. Reverse it in accounts before cancelling.");
  if(e.length)return {ok:false,errors:e};
  r.status="Cancelled";r.cancelReason=reason;addHist(r,"Cancelled",reason,ctx);return {ok:true,r};
}
function nextAction(r){
  if(r.status==="Draft")return ["Submit the request for approval","Requester"];
  if(r.status==="Rejected")return ["Rejected — no further action",""];
  if(r.status==="Cancelled")return ["Cancelled — no further action",""];
  if(r.status==="Completed")return ["Return completed",""];
  if(r.status==="On Hold")return ["On hold: "+(r.holdReason||""),"Management / Admin"];
  return [{2:"Approve, partially approve or reject the request",3:"Request or record the customer’s debit note",4:"Arrange the vehicle and dispatch the material",5:"Receive material, inspect, and post stock",6:"Verify and issue the credit note"}[r.stage],STAGE_OWNER[r.stage]];
}
function stockStatus(r){if(!r.receipts?.length)return "Pending";if(r.receipts.some(x=>!x.posted))return "Pending";return r.receipts.some(x=>x.invStatus==="Posted")?"Posted":"Not Applicable"}

async function readFiles(input){
  const out=[];
  for(const f of input.files){
    if(!/\.(pdf|jpe?g|png|webp)$/i.test(f.name)){toast(`${f.name}: use PDF, JPG, PNG or WEBP.`,"bad");continue}
    if(f.size>10*1024*1024){toast(`${f.name} is over 10 MB.`,"bad");continue}
    try{
      if(S.assets){const a=await S.assets.upload(f);out.push({name:f.name,type:f.type,size:f.size,assetId:a.id,url:a.url})}
      else{
        if(f.size>400*1024){toast(`${f.name} is over 400 KB. Without file storage, attachments must be small.`,"bad");continue}
        const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
        out.push({name:f.name,type:f.type,size:f.size,url});
      }
    }catch(e){toast(`Couldn’t upload ${f.name}: ${e.message||e.code}`,"bad")}
  }
  return out;
}

      +(t.biltyReq==="Yes"?`<div class="fd-copy"><span>Bilty copy</span>${attList(r.attachments.transport,"transport",false)}</div>`:"")))}
  if(n!==5&&r.receipts?.length)out.push(sec(5,"Material receipt and QC",r.receipts.map(rc=>`<div class="fd-card">${dlist([["GRN",`<b>${esc(rc.grn)}</b>`],["Received",fdate(rc.date)],["Received by",vv(rc.by)],["QC",badge(rc.qcStatus)],["Stock posting",badge(rc.invStatus)],["Stock ref.",vv(rc.postRef)],["Goes to",esc(rc.lines.map(l=>{const it=r.items.find(i=>i.key===l.key);return `${prod(it.productId).name}: ${destText(l)}`}).join("; "))],["QC remarks",vv(rc.remarks)]])}${(rc.rcvAttachments||[]).length?`<div class="fd-copy"><span>Received material photos</span>${attList(rc.rcvAttachments,"rv:"+rc.grn,false)}</div>`:""}${(rc.attachments||[]).length?`<div class="fd-copy"><span>QC report</span>${attList(rc.attachments,"rc:"+rc.grn,false)}</div>`:""}</div>`).join("")))
  if(done(6)||(n!==6&&r.credit?.status==="Issued")){const c=r.credit;out.push(sec(6,"Credit note",c.status==="Not Required"?dlist([["Credit note","Not issued"],["Reason",vv(c.notReqReason)]]):dlist([["Credit note no.",vv(c.number)],["Date",fdate(c.date)],["Amount",money(c.amount)],["Tax",money(c.tax)],["Total",money(num(c.amount)+num(c.tax))],["Issued by",vv(c.issuedBy)]])+`<div class="fd-copy"><span>Credit note copy</span>${attList(r.attachments.credit,"credit",false)}</div>`))}
  return `<div class="fd"><h3 class="fd-title">Complete details</h3>${out.join("")}</div>`;
}
function keyDetail(r,n){const t=r.transport||{},d=r.debit||{},L=[];
  if(n<=2)L.push("Reason: "+(reasonsOf(r).join(", ")||"—"));
  if(n>=3&&r.stage>2&&r.status!=="Rejected")L.push(`Approved ${qf.format(sumItems(r,i=>i.apprQty||0))}, ${money(creditBasis(r).cap)}`);
  if(n>=4&&d.number)L.push(`DN ${d.number}, ${money(d.amount)}`);
  if(n>=5&&t.vehicle)L.push(`${t.mode==="Two-leg"&&t.leg2?t.vehicle+" → "+t.leg2.vehicle+(t.leg2.driver?", "+t.leg2.driver:""):t.vehicle+(t.driver?", "+t.driver:"")}${t.biltyNo?", bilty "+t.biltyNo:""}`);
  if(n>=6&&r.receipts?.length)L.push(`GRN ${r.receipts.map(x=>x.grn).join(", ")}`);
  return L.map(x=>`<small class="kd">${esc(x)}</small>`).join("")||"—"}

document.addEventListener("click",e=>{const i=e.target.closest&&e.target.closest('input[type="date"]');if(i&&!i.readOnly&&!i.disabled&&typeof i.showPicker==="function"){try{i.showPicker()}catch(_){}}});
detailTab=tabFromHash();
updateBadge();initStore();
</script>
