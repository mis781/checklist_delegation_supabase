<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="src/assets/nutech.jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Master System</title>

  <!-- Mobile Browser UI Theme Color (Light: Blue #2563eb, Dark: Purple #9333ea) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#9333ea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.json" />

  <script>
    (function () {
      var isMobile = window.innerWidth < 768 || /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
      var storedTheme = localStorage.getItem("theme");
      var isDark = storedTheme === "dark" || (!storedTheme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var activeColor = isMobile ? (isDark ? "#9333ea" : "#2563eb") : "#ffffff";
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      metas.forEach(function (m) {
        m.setAttribute('content', activeColor);
      });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Puritan:ital,wght@0,400;0,700;1,400;1,700&family=Tirra:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
